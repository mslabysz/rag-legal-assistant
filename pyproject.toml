[project]
name = "rag-legal-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maksymilianslabysz", email = "maksymilian.slabysz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.5.1",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.0",
    "ragas>=0.4.3",
    "sentence-transformers>=5.7.0",
    "torch>=2.4.0",
    "uvicorn>=0.52.3",
    "python-multipart",
]

[project.scripts]
rag-legal-assistant = "rag_legal_assistant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]
torchaudio = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]
