services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag_net

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - ./data:/app/data
    depends_on:
      - qdrant
    networks:
      - rag_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - rag_net
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  rag_net:
    driver: bridge